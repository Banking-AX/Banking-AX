
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # FastAPI
    location ^~ /api/v1/customer-agent/ {
        proxy_pass http://ai-server:8000;
    }

    location ^~ /api/v1/rag/ {
        proxy_pass http://ai-server:8000;
    }

    location ^~ /api/v1/staff-agent/ {
        proxy_pass http://ai-server:8000;
    }

    # Spring Boot
    location /api/ {
        proxy_pass http://backend:8080;
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}

