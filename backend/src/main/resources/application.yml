spring:
  servlet:
    multipart:
      max-file-size: ${APP_C02_MAX_FILE_BYTES:10485760}
      max-request-size: ${APP_C02_MAX_FILE_BYTES:10485760}
  application:
    name: banking-ax-backend
  datasource:
    url: ${APP_DB_URL:jdbc:mysql://localhost:3306/banking_ax?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${APP_DB_USERNAME:banking_ax}
    password: ${APP_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: ${APP_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: false
server:
  error:
    include-message: never
app:
  auth:
    # Disabled by default so a missing JWT secret cannot accidentally expose a half-configured login.
    enabled: ${APP_AUTH_ENABLED:false}
    jwt-secret: ${APP_JWT_SECRET:}
    issuer: ${APP_JWT_ISSUER:banking-ax}
    access-token-minutes: ${APP_JWT_ACCESS_TOKEN_MINUTES:30}
    refresh-token-hours: ${APP_REFRESH_TOKEN_HOURS:24}
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:false}
  a01:
    # jdbc requires the DDL's Mock-financial tables to be provisioned; default remains the G1 fixture.
    transaction-query-port: ${APP_A01_TRANSACTION_QUERY_PORT:fake}
  a02:
    # Fake is a non-production fixture. Use jdbc for the Flyway-managed loan table.
    loan-query-port: ${APP_A02_LOAN_QUERY_PORT:fake}
  b01:
    # Private local PoC storage. Only opaque generated keys are persisted or returned internally.
    file-storage-root: ${APP_B01_FILE_STORAGE_ROOT:./var/b01-documents}
    max-file-bytes: ${APP_B01_MAX_FILE_BYTES:10485760}
    signature-storage-root: ${APP_B01_SIGNATURE_STORAGE_ROOT:./var/b01-signatures}
    signature-max-bytes: ${APP_B01_SIGNATURE_MAX_BYTES:1048576}
    # Mock is the safe default. CLOVA sends the stored synthetic application to the configured Template OCR endpoint.
    ocr-provider: ${APP_B01_OCR_PROVIDER:mock}
    clova:
      invoke-url: ${CLOVA_OCR_INVOKE_URL:}
      secret: ${CLOVA_OCR_SECRET:}
      template-id: ${CLOVA_OCR_TEMPLATE_ID:}
      connect-timeout-seconds: ${CLOVA_OCR_CONNECT_TIMEOUT_SECONDS:3}
      read-timeout-seconds: ${CLOVA_OCR_READ_TIMEOUT_SECONDS:15}
    # OpenCV service is fail-closed and opt-in. It reuses the Customer Agent service URL/token.
    image-analysis-enabled: ${APP_B01_IMAGE_ANALYSIS_ENABLED:false}
    image-analysis-timeout-seconds: ${APP_B01_IMAGE_ANALYSIS_TIMEOUT_SECONDS:10}
  b02:
    # jdbc requires the authoritative Mock-financial tables; default remains the G1 fixture.
    account-port: ${APP_B02_ACCOUNT_PORT:fake}
    rule-version: ${APP_B02_RULE_VERSION:1.7.1}
  c02:
    # JPA document metadata is enabled only when the Flyway-managed adapter is explicitly selected.
    document-port: ${APP_C02_DOCUMENT_PORT:local}
    document-provisioning-enabled: ${APP_C02_DOCUMENT_PROVISIONING_ENABLED:false}
    # Review persistence uses the C-02 migration when explicitly enabled.
    review-persistence-enabled: ${APP_C02_REVIEW_PERSISTENCE_ENABLED:false}
    file-storage-root: ${APP_C02_FILE_STORAGE_ROOT:./var/c02-documents}
    max-file-bytes: ${APP_C02_MAX_FILE_BYTES:10485760}
    # Mock is the safe default. CLOVA must be explicitly enabled with an approved server-side credential contract.
    ocr-provider: ${APP_C02_OCR_PROVIDER:mock}
    clova:
      # C-02 is opt-in. Its template is separate from B-01 even when both use one CLOVA domain.
      invoke-url: ${CLOVA_OCR_INVOKE_URL:}
      secret: ${CLOVA_OCR_SECRET:}
      template-id: ${APP_C02_CLOVA_TEMPLATE_ID:}
      connect-timeout-seconds: ${CLOVA_OCR_CONNECT_TIMEOUT_SECONDS:3}
      read-timeout-seconds: ${CLOVA_OCR_READ_TIMEOUT_SECONDS:15}
  case-port: ${APP_CASE_PORT:inmemory}
  # Dev-only C-02 demo Cases (C02DemoSeeder); never loaded in the production profile.
  demo-seed:
    c02-enabled: ${APP_DEMO_SEED_C02_ENABLED:false}
  # Internal Tool endpoint only. Keep disabled until a trusted gateway and customer login are connected.
  workflow-start-enabled: ${APP_WORKFLOW_START_ENABLED:false}
  tool-gateway-token: ${APP_TOOL_GATEWAY_TOKEN:}
  staff-agent-base-url: ${APP_STAFF_AGENT_BASE_URL:}
  staff-agent-token: ${APP_STAFF_AGENT_GATEWAY_TOKEN:}
  customer-agent-base-url: ${APP_CUSTOMER_AGENT_BASE_URL:}
  customer-agent-token: ${APP_CUSTOMER_AGENT_GATEWAY_TOKEN:}
  customer-agent-timeout-seconds: ${APP_CUSTOMER_AGENT_TIMEOUT_SECONDS:20}
  policy-change:
    provider: ${APP_POLICY_CHANGE_PROVIDER:mock-bank}
    source-base-url: ${APP_POLICY_SOURCE_BASE_URL:}
    source-token: ${POLICY_SOURCE_TOKEN:}
    source-signing-secret: ${POLICY_SOURCE_SIGNING_SECRET:}
    # Off by default, so teammates' servers and tests never poll; the button works either way.
    auto-sync-enabled: ${APP_POLICY_AUTO_SYNC_ENABLED:false}
    auto-sync-ms: ${APP_POLICY_AUTO_SYNC_MS:60000}
    # A new task joins here; add a PolicyTaskProfile bean only to narrow its candidate Cases.
    registered-tasks: ${APP_POLICY_REGISTERED_TASKS:TRANSACTION_SEARCH,LOAN_INQUIRY,REPAYMENT_ORDER_CHANGE,HOUSING_SAVINGS_CLOSE,DEBT_ADJUSTMENT,INHERITANCE_DEPOSIT}
  sms:
    provider: ${APP_SMS_PROVIDER:mock}
    otp-ttl-seconds: ${APP_OTP_TTL_SECONDS:180}
    max-attempts: ${APP_OTP_MAX_ATTEMPTS:5}
    resend-seconds: ${APP_OTP_RESEND_SECONDS:60}
    max-requests: ${APP_OTP_MAX_REQUESTS:5}
    # Separate secret used only to HMAC OTP values persisted in work_item.draft_data.
    otp-hmac-secret: ${APP_OTP_HMAC_SECRET:}
solapi:
  api-endpoint: ${SOLAPI_API_ENDPOINT:https://api.solapi.com/messages/v4/send-many/detail}
  api-key: ${SOLAPI_API_KEY:}
  api-secret: ${SOLAPI_API_SECRET:}
  sender-number: ${SOLAPI_SENDER_NUMBER:}
