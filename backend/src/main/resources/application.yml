spring:
  servlet:
    multipart:
      max-file-size: ${APP_C02_MAX_FILE_BYTES:10485760}
      max-request-size: ${APP_C02_MAX_FILE_BYTES:10485760}
  application:
    name: banking-ax-backend
  datasource:
    url: ${APP_DB_URL:jdbc:mysql://localhost:3306/banking_ax?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
    username: ${APP_DB_USERNAME:banking_ax}
    password: ${APP_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: ${APP_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: false
server:
  error:
    include-message: never
app:
  a01:
    # jdbc requires the DDL's Mock-financial tables to be provisioned; default remains the G1 fixture.
    transaction-query-port: ${APP_A01_TRANSACTION_QUERY_PORT:fake}
  b02:
    # jdbc requires the authoritative Mock-financial tables; default remains the G1 fixture.
    account-port: ${APP_B02_ACCOUNT_PORT:fake}
    rule-version: ${APP_B02_RULE_VERSION:1.7.1}
  c02:
    # jpa requires the document metadata migration assigned by T1; local remains the default PoC adapter.
    document-port: ${APP_C02_DOCUMENT_PORT:local}
    document-provisioning-enabled: ${APP_C02_DOCUMENT_PROVISIONING_ENABLED:false}
    # Disabled until the common Flyway owner adds agent_review_run/review_item from the canonical ERD.
    review-persistence-enabled: ${APP_C02_REVIEW_PERSISTENCE_ENABLED:false}
    file-storage-root: ${APP_C02_FILE_STORAGE_ROOT:./var/c02-documents}
    max-file-bytes: ${APP_C02_MAX_FILE_BYTES:10485760}
  case-port: ${APP_CASE_PORT:inmemory}
  tool-gateway-token: ${APP_TOOL_GATEWAY_TOKEN:}
  staff-agent-base-url: ${APP_STAFF_AGENT_BASE_URL:}
  staff-agent-token: ${APP_STAFF_AGENT_GATEWAY_TOKEN:}
  sms:
    provider: ${APP_SMS_PROVIDER:fake}
    otp-ttl-seconds: ${APP_OTP_TTL_SECONDS:180}
    max-attempts: ${APP_OTP_MAX_ATTEMPTS:5}
    resend-seconds: ${APP_OTP_RESEND_SECONDS:60}
